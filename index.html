<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dennis Snellenberg • Fixed Preloader</title>

  <!-- GSAP & Lenis CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/studio-freight/lenis@1.0.19/bundled/lenis.min.js"></script>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    :root {
      --bg-dark: #1c1d20;
      --text-white: #ffffff;
      --text-black: #1c1d20;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-white);
      overflow-x: hidden;
    }

    /* FIX PRELOADER CONTAINER */
    .preloader {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100vh;
      background-color: #141516;
      z-index: 99999;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .preloader-content {
      display: flex;
      align-items: center;
      gap: 15px;
      z-index: 2;
    }

    .preloader-dot {
      width: 10px;
      height: 10px;
      background-color: #ffffff;
      border-radius: 50%;
    }

    .preloader-text {
      font-size: 3rem;
      font-weight: 300;
      color: #ffffff;
      min-width: 250px;
    }

    /* CURSED SVG SLIDE OUT */
    .svg-container {
      position: absolute;
      top: 0;
      width: 100%;
      height: calc(100% + 300px);
      pointer-events: none;
    }

    .svg-container svg {
      width: 100%;
      height: 100%;
      fill: #141516;
    }

    /* HERO & NAVBAR */
    header {
      position: fixed;
      top: 0;
      width: 100%;
      padding: 30px 50px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 100;
    }

    .logo, nav a {
      color: var(--text-white);
      text-decoration: none;
    }

    nav a { margin-left: 30px; }

    .hero {
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      padding-bottom: 50px;
    }

    .hero-title {
      font-size: 8vw;
      font-weight: 400;
      white-space: nowrap;
      text-transform: uppercase;
    }

    .marquee-container {
      display: flex;
      overflow: hidden;
    }

    .marquee-text {
      display: flex;
      gap: 30px;
      animation: marquee 20s linear infinite;
    }

    @keyframes marquee {
      0% { transform: translateX(0%); }
      100% { transform: translateX(-50%); }
    }

    .hero-sub {
      padding: 0 50px;
      margin-top: 40px;
      display: flex;
      justify-content: space-between;
      color: #a2a2a2;
    }
  </style>
</head>
<body>

  <!-- PRELOADER FIXED -->
  <div class="preloader" id="preloader">
    <div class="preloader-content" id="preloader-content">
      <span class="preloader-dot"></span>
      <h1 class="preloader-text" id="greeting">Hello</h1>
    </div>
    <div class="svg-container">
      <svg>
        <path id="svg-path"></path>
      </svg>
    </div>
  </div>

  <!-- WEBSITE CONTENT -->
  <header>
    <a href="#" class="logo">© Code by Dennis</a>
    <nav>
      <a href="#">Work</a>
      <a href="#">About</a>
      <a href="#">Contact</a>
    </nav>
  </header>

  <section class="hero">
    <div class="marquee-container">
      <div class="marquee-text">
        <span class="hero-title">Dennis Snellenberg —</span>
        <span class="hero-title">Freelance Designer & Developer —</span>
        <span class="hero-title">Dennis Snellenberg —</span>
        <span class="hero-title">Freelance Designer & Developer —</span>
      </div>
    </div>
    <div class="hero-sub">
      <p>Helping brands to stand out in the digital era.</p>
      <p>Located in the Netherlands</p>
    </div>
  </section>

  <script>
    const words = [
      "Hello",
      "Bonjour",
      "Selamat datang",
      "Ciao",
      "Olá",
      "おい",
      "Hallå",
      "Guten tag",
      "Hallo"
    ];

    const greetingElement = document.getElementById("greeting");
    const preloader = document.getElementById("preloader");
    const preloaderContent = document.getElementById("preloader-content");
    const path = document.getElementById("svg-path");

    let width = window.innerWidth;
    let height = window.innerHeight;

    // Kalkulasi jalur kurva SVG sesuai ukuran layar
    const initialPath = `M0 0 L${width} 0 L${width} ${height} Q${width/2} ${height + 300} 0 ${height} Z`;
    const targetPath = `M0 0 L${width} 0 L${width} 0 Q${width/2} 0 0 0 Z`;

    path.setAttribute("d", initialPath);

    let index = 0;

    // Pergantian teks sapaan
    const interval = setInterval(() => {
      index++;
      if (index < words.length) {
        greetingElement.textContent = words[index];
      } else {
        clearInterval(interval);
        exitAnimation();
      }
    }, 150);

    // Animasi Keluar (Exit Animation) yang Halus
    function exitAnimation() {
      const tl = gsap.timeline();

      tl.to(preloaderContent, {
        opacity: 0,
        duration: 0.3,
        ease: "power2.out"
      })
      .to(path, {
        attr: { d: targetPath },
        duration: 0.8,
        ease: "power2.in"
      })
      .to(preloader, {
        y: "-100%",
        duration: 0.8,
        ease: "power4.inOut"
      }, "-=0.8")
      .set(preloader, { display: "none" });
    }

    // Smooth Scroll
    const lenis = new Lenis();
    function raf(time) {
      lenis.raf(time);
      requestAnimationFrame(raf);
    }
    requestAnimationFrame(raf);
  </script>
</body>
</html>

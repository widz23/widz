<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WIDZ SHOP</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #fdf8f9;
            color: #333;
        }

        /* Top Notification Bar */
        .top-bar {
            background-color: #b05270;
            color: white;
            text-align: center;
            padding: 8px 15px;
            font-size: 13px;
        }

        /* Navigation Header */
        header {
            background-color: #f2cdd7;
            padding: 15px 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 22px;
            font-weight: bold;
            color: #4a2330;
            letter-spacing: 1px;
        }

        nav ul {
            display: flex;
            list-style: none;
            gap: 20px;
        }

        nav a {
            text-decoration: none;
            color: #4a2330;
            font-size: 14px;
            font-weight: 600;
        }

        .header-icons {
            display: flex;
            gap: 15px;
            font-size: 18px;
        }

        /* Main Section / Hero Grid */
        .hero-grid {
            display: grid;
            grid-template-columns: 1fr 1fr 0.8fr;
            gap: 15px;
            padding: 20px 5%;
        }

        .hero-card {
            border-radius: 8px;
            overflow: hidden;
            position: relative;
            background-size: cover;
            background-position: center;
            min-height: 250px;
        }

        .hero-large {
            background-color: #a35d73;
            color: white;
            padding: 40px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            grid-row: span 2;
        }

        .hero-large h1 {
            font-size: 32px;
            margin-bottom: 10px;
        }

        .hero-large p {
            font-size: 14px;
            margin-bottom: 20px;
            opacity: 0.9;
        }

        .btn-pink {
            display: inline-block;
            background-color: #7d334c;
            color: white;
            padding: 10px 20px;
            text-decoration: none;
            border-radius: 4px;
            font-weight: bold;
            width: fit-content;
        }

        .hero-middle {
            grid-row: span 2;
            background-color: #eed3db;
        }

        .hero-middle img, .hero-small img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .hero-small {
            background-color: #f7e1e7;
        }

        /* Gallery Section */
        .gallery-section {
            padding: 40px 5%;
        }

        .gallery-title {
            text-align: center;
            font-size: 24px;
            margin-bottom: 25px;
            color: #4a2330;
        }

        .product-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
        }

        .product-card {
            background-color: #ebd0d7;
            border-radius: 8px;
            overflow: hidden;
            height: 200px;
        }

        .product-card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* Responsif untuk layar HP */
        @media (max-width: 768px) {
            .hero-grid {
                grid-template-columns: 1fr;
            }
            .product-grid {
                grid-template-columns: repeat(2, 1fr);
            }
            nav ul {
                display: none;
            }
        }
    </style>
</head>
<body>

    <div class="top-bar">
        Spesial Promo  - Diskon 20%
    </div>

    <header>
        <div class="logo">WIDZ SHOP</div>
        <nav>
            <ul>
                <li><a href="#">HOME</a></li>
                <li><a href="#">PRODUCTS</a></li>
                <li><a href="#">MENGGUNAN</a></li>
                <li><a href="#">IMPROSSESI</a></li>
                <li><a href="#">CARIVIR</a></li>
            </ul>
        </nav>
        <div class="header-icons">
            <span>🔍</span>
            <span>🛍️</span>
        </div>
    </header>

    <section class="hero-grid">
        <div class="hero-card hero-large">
            <h1>WIDZ<br>SHOP</h1>
            <p>ORDER  SEKARANG</p>
            <a href="#" class="btn-pink">Book now</a>
        </div>

        <div class="hero-card hero-middle">
            <img src="https://images.unsplash.com/photo-1515886657613-9f3515b0c78f?w=600" alt="Model Fashion Pink">
        </div>

        <div class="hero-card hero-small">
            <img src="https://images.unsplash.com/photo-1483985988355-763728e1935b?w=400" alt="Fashion 1">
        </div>

        <div class="hero-card hero-small">
            <img src="https://images.unsplash.com/photo-1492707892479-7bc8d5a4ee93?w=400" alt="Fashion 2">
        </div>
    </section>

    <section class="gallery-section">
        <h2 class="gallery-title">Fashion gallery</h2>
        <div class="product-grid">
            <div class="product-card">
                <img src="https://images.unsplash.com/photo-1509631179647-0177331693ae?w=300" alt="Gallery 1">
            </div>
            <div class="product-card">
                <img src="https://images.unsplash.com/photo-1529139574466-a303027c1d8b?w=300" alt="Gallery 2">
            </div>
            <div class="product-card">
                <img src="https://images.unsplash.com/photo-1581044777550-4cfa60707c03?w=300" alt="Gallery 3">
            </div>
            <div class="product-card">
                <img src="https://images.unsplash.com/photo-1485230895905-ec40ba36b9bc?w=300" alt="Gallery 4">
            </div>
        </div>
    </section>

</body>
</html>

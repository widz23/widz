<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RULY DAMERS — Brand Designer</title>
  
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&family=Reenie+Beanie&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg-cream: #F5F0E8;
      --bg-card: #EBE4DA;
      --orange: #E64A19;
      --yellow: #F4A261;
      --yellow-bright: #F5B041;
      --dark: #121212;
      --white: #FFFFFF;
      --gray: #666666;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: var(--bg-cream); color: var(--dark); line-height: 1.4; overflow-x: hidden; }

    /* --- NAVBAR --- */
    nav { display: flex; justify-content: space-between; align-items: center; padding: 25px 6%; border-bottom: 1px solid rgba(0,0,0,0.06); }
    .logo { font-weight: 900; font-size: 1.3rem; letter-spacing: -0.5px; display: flex; align-items: center; gap: 6px; }
    .logo span { color: var(--orange); font-size: 1.4rem; }
    .nav-links { display: flex; gap: 28px; list-style: none; font-size: 0.75rem; font-weight: 800; text-transform: uppercase; letter-spacing: 0.5px; }
    .nav-links a { text-decoration: none; color: var(--dark); transition: color 0.2s; }
    .nav-links a:hover { color: var(--orange); }
    .btn-cta-nav { background: var(--yellow-bright); border: 1px solid var(--dark); padding: 10px 22px; border-radius: 20px; font-weight: 800; font-size: 0.75rem; cursor: pointer; box-shadow: 2px 2px 0px var(--dark); }

    /* --- HERO SECTION --- */
    .hero { display: grid; grid-template-columns: 1fr 1fr; padding: 50px 6% 60px; align-items: center; position: relative; }
    .tag { color: var(--orange); font-size: 0.7rem; font-weight: 800; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 15px; display: block; }
    .hero-title { font-size: 6.5rem; line-height: 0.82; font-weight: 900; letter-spacing: -3px; margin-bottom: 25px; text-transform: uppercase; }
    .hero-desc { font-size: 0.9rem; color: #444; max-width: 360px; line-height: 1.5; margin-bottom: 25px; font-weight: 500; }
    .btn-main { background: var(--yellow-bright); border: 1px solid var(--dark); padding: 12px 26px; border-radius: 20px; font-weight: 800; font-size: 0.8rem; cursor: pointer; box-shadow: 2.5px 2.5px 0px var(--dark); }

    .hero-visual { 
      position: relative; 
      display: flex; 
      justify-content: center; 
      align-items: center;
      height: 380px; 
      overflow: hidden; 
      border-radius: 12px;
      background: transparent;
    }
    
    .hero-img { 
      position: relative; 
      z-index: 2; 
      width: 100%; 
      max-width: 360px; 
      height: 100%; 
      object-fit: contain;
      display: block; 
    }

    /* --- ABOUT ME --- */
    .about { display: grid; grid-template-columns: 1fr 1fr; gap: 60px; padding: 80px 6%; background: var(--bg-card); border-top: 1px solid rgba(0,0,0,0.06); border-bottom: 1px solid rgba(0,0,0,0.06); align-items: center; }
    
    .about-img-wrapper {
      width: 100%;
      max-width: 360px;
      height: 380px;
      overflow: hidden;
      border-radius: 12px;
      margin: 0 auto;
      border: 1px solid rgba(0,0,0,0.1);
    }

    .about-img {
      width: 100%;
      height: 100%;
      object-fit: cover; 
      object-position: center 30%; 
      border-radius: 12px;
      display: block;
    }
    
    .about-title { font-family: 'Instrument Serif', serif; font-size: 3.5rem; line-height: 1; margin-bottom: 20px; font-weight: 400; }
    .about-title i { font-style: italic; color: var(--orange); }
    .about-text { font-size: 0.88rem; color: #555; line-height: 1.6; margin-bottom: 25px; }
    .signature { font-family: 'Reenie Beanie', cursive; font-size: 3rem; color: var(--dark); }

    /* --- FEATURED PROJECTS --- */
    .work { padding: 80px 6%; }
    .work-header { display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 40px; }
    .work-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 25px; }
    .work-card { background: var(--white); border-radius: 12px; padding: 16px; border: 1px solid rgba(0,0,0,0.08); box-shadow: 0 4px 15px rgba(0,0,0,0.02); }
    .work-card img { width: 100%; height: 260px; object-fit: cover; border-radius: 8px; margin-bottom: 15px; }
    .work-card h4 { font-size: 1.05rem; font-weight: 900; }
    .work-card p { font-size: 0.75rem; color: var(--gray); font-weight: 600; }

    /* --- FOOTER --- */
    footer { background: var(--dark); color: var(--white); padding: 70px 6% 30px; }
    .footer-top { display: flex; justify-content: space-between; margin-bottom: 50px; }
    .footer-brand p { color: #888; font-size: 0.78rem; margin-top: 12px; max-width: 280px; }

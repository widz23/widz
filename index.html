<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DAMERS | Portfolio</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@800;900&family=Poppins:wght@400;600;700&family=Caveat:wght@700&family=Architects+Daughter&display=swap" rel="stylesheet">
  <style>
    :root {
      --yellow: #FFDE59;
      --blue: #2563EB;
      --sky-blue: #0066FF;
      --red: #FF5A5F;
      --dark: #1A1A1A;
      --bg-cream: #FDF9F0;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Poppins', sans-serif; background-color: var(--bg-cream); color: var(--dark); overflow-x: hidden; }

    /* Header */
    header { display: flex; justify-content: space-between; align-items: center; padding: 20px 8%; }
    .header-left { display: flex; align-items: center; gap: 10px; font-weight: 800; font-size: 0.85rem; }
    .star-icon { color: var(--red); font-size: 1.5rem; }
    .badge-portfolio { border: 2px solid var(--dark); padding: 8px 22px; border-radius: 30px; font-weight: 700; font-size: 0.8rem; letter-spacing: 0.5px; }

    /* Hero Section */
    .hero { position: relative; padding: 20px 8% 60px 8%; display: grid; grid-template-columns: 1fr 1fr; gap: 20px; align-items: center; }
    
    .hero-text { position: relative; z-index: 2; }
    .hero-text h2 { font-family: 'Caveat', cursive; color: var(--red); font-size: 4rem; transform: rotate(-3deg); line-height: 1; margin-bottom: 5px; }
    .hero-text h1 { font-family: 'Montserrat', sans-serif; font-size: 6.5rem; line-height: 0.85; text-transform: uppercase; font-weight: 900; letter-spacing: -2px; }
    .hero-text .asterisk { color: var(--sky-blue); font-size: 5rem; display: inline-block; vertical-align: middle; margin-left: 10px; }

    .tagline-box { background-color: var(--yellow); border: 2px solid var(--dark); padding: 12px 20px; font-family: 'Architects Daughter', cursive; font-size: 1.2rem; font-weight: 700; display: inline-block; transform: rotate(-1.5deg); box-shadow: 4px 4px 0px var(--dark); margin-top: 25px; border-radius: 4px; }
    
    .location-info { display: flex; align-items: center; gap: 8px; margin-top: 20px; font-size: 0.75rem; font-weight: 700; text-transform: uppercase; }

    /* Photo & Yellow Blob Area */
    .hero-image-wrapper { position: relative; width: 100%; height: 500px; display: flex; justify-content: center; align-items: flex-end; }
    
    /* Bentuk Kuning Abstrak (Blob) */
    .yellow-blob {
      position: absolute;
      top: 0;
      right: 0;
      width: 480px;
      height: 480px;
      background-color: var(--yellow);
      /* Formula Border Radius untuk membuat bentuk Blob Organik */
      border-radius: 42% 58% 70% 30% / 45% 45% 55% 55%;
      z-index: 1;
    }

    /* Sticker Top Right */
    .sticker-purpose {
      position: absolute;
      top: -10px;
      right: 20px;
      z-index: 4;
      background: var(--yellow);
      border-radius: 50%;
      width: 90px;
      height: 90px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      font-weight: 800;
      font-size: 0.65rem;
      border: 2px dashed var(--dark);
      transform: rotate(12deg);
    }

    /* Subjek Foto (Tanpa Background) */
    .hero-person-img {
      position: relative;
      z-index: 2;
      height: 100%;
      object-fit: contain;
    }

    /* Sticker Superpower */
    .badge-superpower {
      position: absolute;
      bottom: 40px;
      right: -10px;
      z-index: 3;
      background: #3B82F6;
      color: white;
      padding: 12px 20px;
      border-radius: 15px;
      font-family: 'Architects Daughter', cursive;
      font-size: 1.2rem;
      font-weight: 700;
      transform: rotate(6deg);
      border: 3px solid white;
      box-shadow: 4px 4px 0px var(--dark);
      line-height: 1.1;
    }

    /* Decorative Elements */
    .dot-pattern { position: absolute; top: 10px; left: 15%; width: 80px; opacity: 0.3; z-index: 1; }
    .plus-icon { position: absolute; right: 10%; bottom: 45%; color: white; font-size: 2rem; font-weight: bold; z-index: 3; text-shadow: 2px 2px var(--dark); }

    /* Responsif */
    @media (max-width: 900px) {
      .hero { grid-template-columns: 1fr; text-align: center; }
      .hero-text h1 { font-size: 4.5rem; }
      .hero-image-wrapper { height: 400px; margin-top: 30px; }
      .yellow-blob { width: 320px; height: 320px; left: 50%; transform: translateX(-50%); }
    }
  </style>
</head>
<body>

  <header>
    <div class="header-left">
      <span class="star-icon">★</span>
      <span>GRAPHIC & WEB DESIGNER</span>
    </div>
    <div class="badge-portfolio">CREATIVE PORTFOLIO</div>
  </header>

  <section class="hero">
    <div class="hero-text">
      <h2>Hello!</h2>
      <h1>I'M <span class="asterisk">✶</span><br>DAMERS</h1>
      <div class="tagline-box">
        I design digital experiences that connect & convert.
      </div>
      <div class="location-info">
        🌐 BASED IN ANY CITY, ST &bull; WORKING WORLDWIDE
      </div>
    </div>

    <div class="hero-image-wrapper">
      <div class="sticker-purpose">
        DESIGN<br>😊<br><small>with purpose</small>
      </div>

      <div class="yellow-blob"></div>

      <img src="https://i.ibb.co/C03S48t/model-nobg.png" alt="Damers" class="hero-person-img">

      <div class="badge-superpower">
        DESIGN<br>IS MY ⚡<br>SUPERPOWER
      </div>

      <div class="plus-icon">+</div>
    </div>
  </section>

</body>
</html>
